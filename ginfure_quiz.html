<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>銀フレ 単語テスト</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="銀フレ">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --rose: #c0718a;
  --rose-light: #faedf1;
  --lavender: #8a7ab8;
  --lavender-light: #eeebf8;
  --sage: #6aa88c;
  --sage-light: #e8f4ee;
  --amber: #b88a50;
  --amber-light: #fdf3e3;
  --bg: #f9f6fc;
  --surface: #ffffff;
  --border: #ede8f2;
  --text: #28253a;
  --muted: #a09aac;
  --correct: #5a9e7a;
  --wrong: #c06060;
  --card-shadow: 0 2px 20px rgba(90,70,130,0.08);
  --card-shadow-md: 0 4px 36px rgba(90,70,130,0.11);
}

body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  color: var(--text);
}

.app {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  position: relative;
}

.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 0 20px 40px;
  min-height: 100vh;
}
.screen.active { display: flex; }

/* ===== LOGIN / REGISTER ===== */
.auth-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 20px;
  width: 100%;
}
.auth-card {
  background: var(--surface);
  border-radius: 24px;
  padding: 36px 24px 28px;
  width: 100%;
  box-shadow: var(--card-shadow-md);
  border: 1px solid var(--border);
}
.auth-title {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--rose), var(--lavender));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 6px;
}
.auth-sub {
  font-size: 0.78rem;
  color: var(--muted);
  text-align: center;
  margin-bottom: 28px;
}
.auth-avatar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}
.auth-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  margin-bottom: 8px;
}
.auth-avatar svg { opacity: 0.35; }
.auth-avatar img { width:100%; height:100%; object-fit:cover; }
.avatar-hint { font-size: 0.68rem; color: var(--muted); }
.auth-input {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 0.93rem;
  color: var(--text);
  background: var(--bg);
  margin-bottom: 10px;
  outline: none;
  transition: border-color 0.15s;
}
.auth-input:focus { border-color: var(--lavender); background: #fff; }
.auth-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--rose), var(--lavender));
  color: white;
  font-size: 0.95rem;
  font-weight: 800;
  border: none;
  border-radius: 13px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(130,90,170,0.2);
  margin-top: 6px;
  transition: transform 0.1s;
}
.auth-btn:active { transform: scale(0.97); }
.auth-switch {
  text-align: center;
  margin-top: 18px;
  font-size: 0.82rem;
  color: var(--muted);
}
.auth-switch span {
  color: var(--lavender);
  font-weight: 700;
  cursor: pointer;
}
.auth-error {
  color: var(--wrong);
  font-size: 0.8rem;
  font-weight: 600;
  text-align: center;
  margin-bottom: 10px;
  display: none;
}

/* ===== HOME ===== */
.home-hero {
  text-align: center;
  padding: 36px 0 20px;
  color: var(--text);
  width: 100%;
}
.user-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-radius: 16px;
  padding: 10px 14px;
  margin-bottom: 16px;
  width: 100%;
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
}
.user-bar-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.user-bar-avatar img { width:100%; height:100%; object-fit:cover; }
.user-bar-name { font-size: 0.88rem; font-weight: 800; flex: 1; }
.logout-btn {
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: 700;
  cursor: pointer;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  transition: all 0.1s;
}
.logout-btn:active { background: var(--bg); }

.home-hero h1 {
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: -2px;
  background: linear-gradient(135deg, var(--rose), var(--lavender));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.home-hero .subtitle {
  font-size: 0.82rem;
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: 0.5px;
}

.home-card {
  background: var(--surface);
  border-radius: 24px;
  padding: 26px 22px;
  width: 100%;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--border);
}

.stats-row {
  display: flex;
  justify-content: space-around;
  margin-bottom: 24px;
  padding-bottom: 22px;
  border-bottom: 1.5px solid var(--border);
}
.stat { text-align: center; }
.stat-num { font-size: 1.9rem; font-weight: 900; color: var(--rose); }
.stat-label { font-size: 0.63rem; color: var(--muted); margin-top: 3px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

.mode-btn {
  width: 100%;
  padding: 15px 16px;
  border: 1.5px solid var(--border);
  border-radius: 16px;
  font-size: 0.93rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 6px rgba(90,70,130,0.05);
}
.mode-btn:active { transform: scale(0.97); }
.mode-btn.quiz-btn  { border-color: #e8cdd6; background: #fffafe; }
.mode-btn.flash-btn { border-color: #d8d0ee; background: #faf8ff; }
.mode-btn .btn-icon {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.mode-btn.quiz-btn  .btn-icon { background: var(--rose-light); }
.mode-btn.flash-btn .btn-icon { background: var(--lavender-light); }
.mode-btn .btn-text { text-align: left; }
.mode-btn .btn-title { font-size: 0.93rem; font-weight: 800; display: block; color: var(--text); }
.mode-btn .btn-desc  { font-size: 0.71rem; color: var(--muted); display: block; margin-top: 2px; }

.word-count-select {
  display: flex;
  gap: 5px;
  margin-bottom: 14px;
  background: var(--bg);
  border-radius: 12px;
  padding: 4px;
}
.count-opt {
  flex: 1;
  padding: 9px;
  border: none;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  transition: all 0.15s;
}
.count-opt.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 8px rgba(90,70,130,0.08);
}

/* ===== QUIZ ===== */
.quiz-topbar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 0 12px;
}
.back-btn {
  width: 36px; height: 36px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.1s;
  box-shadow: 0 1px 4px rgba(90,70,130,0.06);
}
.back-btn svg { fill: currentColor; }
.back-btn:active { background: var(--bg); }
.prog-wrap { flex: 1; background: var(--border); border-radius: 99px; height: 6px; overflow: hidden; }
.prog-bar { height: 100%; background: linear-gradient(90deg, var(--rose), var(--lavender)); border-radius: 99px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
.score-chip {
  background: var(--rose-light);
  color: var(--rose);
  font-size: 0.78rem;
  font-weight: 800;
  padding: 5px 12px;
  border-radius: 99px;
  white-space: nowrap;
  border: 1px solid #e8c8d4;
}

.word-card {
  background: var(--surface);
  border-radius: 22px;
  padding: 30px 22px 26px;
  width: 100%;
  text-align: center;
  box-shadow: var(--card-shadow-md);
  margin-bottom: 14px;
  position: relative;
  border: 1px solid var(--border);
}
.word-tag {
  display: inline-block;
  background: var(--lavender-light);
  color: var(--lavender);
  font-size: 0.66rem;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 99px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 16px;
}
.word-english {
  font-size: 2.3rem;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -1px;
  line-height: 1.1;
  margin-bottom: 6px;
}
.word-phonetic {
  font-size: 0.8rem;
  color: #ccc;
  margin-bottom: 18px;
  font-family: serif;
  letter-spacing: 0.2px;
}
.speak-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  background: var(--amber-light);
  color: var(--amber);
  font-size: 0.78rem;
  font-weight: 800;
  border: 1.5px solid #edd8b0;
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.1s;
}
.speak-btn:active { transform: scale(0.94); background: #f5e6c4; }
.speak-icon { width: 13px; height: 13px; fill: var(--amber); }

.choices {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}
.choice-btn {
  padding: 15px 17px;
  background: var(--surface);
  color: var(--text);
  font-size: 0.92rem;
  font-weight: 600;
  border: 1.5px solid var(--border);
  border-radius: 13px;
  cursor: pointer;
  text-align: left;
  transition: all 0.12s;
  box-shadow: 0 1px 4px rgba(90,70,130,0.04);
  line-height: 1.35;
}
.choice-btn:active:not([disabled]) { transform: scale(0.98); border-color: var(--lavender); background: var(--lavender-light); }
.choice-btn.correct { border-color: var(--correct); background: var(--sage-light); color: #1a5438; }
.choice-btn.wrong   { border-color: var(--wrong);   background: #fdf0f0; color: #7a2020; }
.choice-btn[disabled] { cursor: default; }

.feedback-card {
  background: var(--surface);
  border-radius: 18px;
  padding: 18px 20px;
  width: 100%;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--border);
  margin-bottom: 12px;
  display: none;
  animation: popIn 0.22s cubic-bezier(.34,1.56,.64,1);
}
.feedback-card.visible { display: block; }
@keyframes popIn {
  from { transform: scale(0.92) translateY(10px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}
.feedback-label {
  font-size: 0.93rem;
  font-weight: 800;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.feedback-label.ok  { color: var(--correct); }
.feedback-label.ng  { color: var(--wrong); }
.mnemonic-tag {
  display: inline-block;
  background: var(--amber-light);
  color: var(--amber);
  font-size: 0.6rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  border: 1px solid #edd8b0;
}
.mnemonic-body { font-size: 0.86rem; color: #5a5060; line-height: 1.6; }

.next-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--rose), var(--lavender));
  color: white;
  font-size: 0.95rem;
  font-weight: 800;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 5px 18px rgba(130,90,170,0.22);
  transition: all 0.1s;
  display: none;
  margin-bottom: 24px;
  letter-spacing: 0.3px;
}
.next-btn:active { transform: scale(0.97); }

/* ===== FLASHCARD ===== */
.flash-topbar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 0 12px;
}
.flash-counter {
  flex: 1;
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  font-weight: 700;
}

.flashcard {
  background: var(--surface);
  border-radius: 22px;
  width: 100%;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 34px 26px;
  box-shadow: var(--card-shadow-md);
  cursor: pointer;
  transition: transform 0.15s;
  text-align: center;
  margin-bottom: 12px;
  position: relative;
  user-select: none;
  border: 1px solid var(--border);
}
.flashcard:active { transform: scale(0.98); }
.flash-tap-hint { font-size: 0.68rem; color: #d0cad8; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.3px; }
.flash-word { font-size: 2.1rem; font-weight: 900; color: var(--text); letter-spacing: -1px; }
.flash-phonetic { font-size: 0.78rem; color: #ccc; margin-top: 6px; font-family: serif; }
.flash-meaning { font-size: 1.2rem; font-weight: 800; color: var(--lavender); margin-top: 6px; }

.mnemonic-strip {
  background: var(--surface);
  border-radius: 16px;
  padding: 15px 18px;
  width: 100%;
  margin-bottom: 12px;
  border: 1.5px solid var(--amber-light);
}
.mnemonic-strip .mnemonic-tag-white {
  font-size: 0.6rem;
  font-weight: 800;
  color: var(--amber);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.mnemonic-strip .mnemonic-text-white { font-size: 0.85rem; color: #5a5060; line-height: 1.55; }

.flash-nav {
  display: flex;
  gap: 8px;
  width: 100%;
  margin-bottom: 32px;
}
.nav-btn {
  flex: 1;
  padding: 14px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.86rem;
  font-weight: 700;
  border-radius: 13px;
  cursor: pointer;
  transition: all 0.1s;
  box-shadow: 0 1px 4px rgba(90,70,130,0.05);
}
.nav-btn:active { background: var(--bg); transform: scale(0.97); }
.nav-btn.center { flex: 0.8; border-color: var(--amber-light); color: var(--amber); background: var(--amber-light); }

/* ===== RESULT ===== */
.result-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 20px;
}
.result-card {
  background: var(--surface);
  border-radius: 24px;
  padding: 40px 24px 32px;
  width: 100%;
  text-align: center;
  box-shadow: var(--card-shadow-md);
  border: 1px solid var(--border);
}
.result-title { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
.result-score {
  font-size: 5rem;
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(135deg, var(--rose), var(--lavender));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
.result-denom { font-size: 0.92rem; color: var(--muted); margin-bottom: 10px; }
.result-pct {
  display: inline-block;
  padding: 5px 18px;
  border-radius: 99px;
  font-size: 0.85rem;
  font-weight: 800;
  margin-bottom: 16px;
}
.result-pct.s { background: var(--sage-light); color: #1a5438; }
.result-pct.a { background: var(--lavender-light); color: #3d2e8a; }
.result-pct.b { background: var(--amber-light); color: #7a5010; }
.result-pct.c { background: #fdf0f0; color: #7a2020; }
.result-msg { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 28px; }
.result-actions { display: flex; flex-direction: column; gap: 10px; }
.btn-retry {
  padding: 16px;
  background: linear-gradient(135deg, var(--rose), var(--lavender));
  color: white;
  font-size: 0.93rem;
  font-weight: 800;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 5px 18px rgba(130,90,170,0.22);
  transition: transform 0.1s;
}
.btn-retry:active { transform: scale(0.97); }
.btn-home {
  padding: 15px;
  background: transparent;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 700;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.1s;
}
.btn-home:active { background: var(--bg); }

.learned-btn {
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 0.86rem;
  font-weight: 800;
  border-radius: 13px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(90,70,130,0.04);
}
.learned-btn.checked { border-color: var(--sage); background: var(--sage-light); color: #1a5438; }
.learned-btn:active { transform: scale(0.97); }

.learned-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  background: var(--sage-light);
  color: var(--sage);
  font-size: 0.6rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  display: none;
  border: 1px solid #b8dac8;
}
.learned-badge.show { display: inline-block; }
.flash-pos-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  background: var(--lavender-light);
  color: var(--lavender);
  font-size: 0.6rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  display: none;
  border: 1px solid #d0c8ee;
  letter-spacing: 0.3px;
}
.flash-pos-badge.show { display: inline-block; }


.flash-pos-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  background: var(--lavender-light);
  color: var(--lavender);
  font-size: 0.6rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  display: none;
  border: 1px solid #d0c8ee;
  letter-spacing: 0.3px;
}
.flash-pos-badge.show { display: inline-block; }

.confetti-wrap {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; overflow: hidden; z-index: 100;
}
.confetti-piece {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* hidden file input */
#avatarInput { display: none; }

/* ===== SEARCH ===== */
.search-topbar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 0 12px;
}
.search-input-wrap {
  width: 100%;
  position: relative;
  margin-bottom: 14px;
}
.search-input {
  width: 100%;
  padding: 14px 46px 14px 18px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  font-size: 1rem;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s;
  box-shadow: var(--card-shadow);
}
.search-input:focus { border-color: var(--lavender); }
.search-clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 1.1rem;
  padding: 4px;
  display: none;
}
.search-hint {
  text-align: center;
  color: var(--muted);
  font-size: 0.82rem;
  margin-top: 40px;
}
.search-results {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.search-result-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 16px 18px;
  box-shadow: var(--card-shadow);
  cursor: pointer;
  transition: all 0.12s;
}
.search-result-card:active { transform: scale(0.98); border-color: var(--lavender); }
.sr-top {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}
.sr-word {
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--text);
}
.sr-phonetic {
  font-size: 0.75rem;
  color: #ccc;
  font-family: serif;
}
.sr-jp {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--lavender);
  margin-bottom: 8px;
}
.sr-mnemonic {
  font-size: 0.78rem;
  color: #7a6a80;
  line-height: 1.5;
  background: var(--amber-light);
  border-radius: 8px;
  padding: 7px 10px;
}
.sr-open-btn {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--lavender);
  background: var(--lavender-light);
  border: 1px solid #d8d0ee;
  border-radius: 99px;
  padding: 5px 12px;
  cursor: pointer;
}
.no-results {
  text-align: center;
  color: var(--muted);
  font-size: 0.88rem;
  margin-top: 30px;
}
.search-count {
  font-size: 0.72rem;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="app">

<!-- LOGIN -->
<div class="screen active" id="loginScreen">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-title">銀フレ</div>
      <div class="auth-sub">ログインして学習を続けよう</div>
      <div class="auth-error" id="loginError"></div>
      <input class="auth-input" type="text" id="loginUser" placeholder="ユーザー名" autocomplete="username">
      <input class="auth-input" type="password" id="loginPass" placeholder="パスワード" autocomplete="current-password">
      <button class="auth-btn" onclick="doLogin()">ログイン</button>
      <div class="auth-switch">アカウントがない？ <span onclick="showRegister()">新規登録</span></div>
    </div>
  </div>
</div>

<!-- REGISTER -->
<div class="screen" id="registerScreen">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-title">新規登録</div>
      <div class="auth-sub">アカウントを作成しよう</div>
      <div class="auth-error" id="regError"></div>
      <div class="auth-avatar-wrap">
        <div class="auth-avatar" id="regAvatarPreview" onclick="document.getElementById('avatarInput').click()">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="#a09aac"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </div>
        <div class="avatar-hint">タップして写真を選ぶ（任意）</div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(this)">
      <input class="auth-input" type="text" id="regUser" placeholder="ユーザー名" autocomplete="username">
      <input class="auth-input" type="password" id="regPass" placeholder="パスワード" autocomplete="new-password">
      <input class="auth-input" type="password" id="regPass2" placeholder="パスワード（確認）" autocomplete="new-password">
      <button class="auth-btn" onclick="doRegister()">登録する</button>
      <div class="auth-switch">すでにアカウントがある？ <span onclick="showLogin()">ログイン</span></div>
    </div>
  </div>
</div>

<!-- HOME -->
<div class="screen" id="homeScreen">
  <div class="user-bar" style="margin-top:20px;">
    <div class="user-bar-avatar" id="homeAvatar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#a09aac"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
    </div>
    <div class="user-bar-name" id="homeUserName">—</div>
    <button class="logout-btn" onclick="doLogout()">ログアウト</button>
  </div>

  <div class="home-hero">
    <h1>銀フレ</h1>
    <div class="subtitle">TOEIC Silver Phrases — 英単語マスター</div>
  </div>

  <div class="home-card">
    <div class="stats-row">
      <div class="stat">
        <div class="stat-num" id="statWords">—</div>
        <div class="stat-label">収録単語</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statLearned" style="color:var(--sage);">0</div>
        <div class="stat-label">覚えた</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statBest">—</div>
        <div class="stat-label">最高正答率</div>
      </div>
    </div>

    <div style="margin-bottom:16px;">
      <div style="font-size:0.72rem;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">出題数</div>
      <div class="word-count-select">
        <button class="count-opt" data-n="10" onclick="setCount(10,this)">10問</button>
        <button class="count-opt active" data-n="20" onclick="setCount(20,this)">20問</button>
        <button class="count-opt" data-n="100" onclick="setCount(100,this)">100問</button>
        <button class="count-opt" data-n="9999" onclick="setCount(9999,this)">全問</button>
      </div>
    </div>

    <button class="mode-btn quiz-btn" onclick="startQuiz(false)">
      <div class="btn-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M11.5 2C6.81 2 3 5.81 3 10.5S6.81 19 11.5 19h.5v3c4.86-2.34 8-7 8-11.5C20 5.81 16.19 2 11.5 2zm1 14.5h-2v-2h2v2zm0-4h-2c0-3.25 3-3 3-5 0-1.1-.9-2-2-2s-2 .9-2 2h-2c0-2.21 1.79-4 4-4s4 1.79 4 4c0 2.5-3 2.75-3 5z"/></svg>
      </div>
      <div class="btn-text">
        <span class="btn-title">クイズ — 全単語</span>
        <span class="btn-desc">英語→日本語 4択テスト + 発音</span>
      </div>
    </button>

    <button class="mode-btn" style="border-color:#b8dac8;background:#f0faf5;" onclick="startQuiz(true)">
      <div class="btn-icon" style="background:var(--sage-light);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6aa88c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="btn-text">
        <span class="btn-title">クイズ — 未習得のみ</span>
        <span class="btn-desc">覚えた済み以外の単語でテスト</span>
      </div>
    </button>

    <button class="mode-btn flash-btn" onclick="startFlash(false)">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a7ab8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="btn-text">
        <span class="btn-title">単語帳 — 全単語</span>
        <span class="btn-desc">語呂合わせ付きフラッシュカード</span>
      </div>
    </button>

    <button class="mode-btn" style="border-color:#edd8b0;background:#fdf8f0;" onclick="startFlash(true)">
      <div class="btn-icon" style="background:var(--amber-light);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b88a50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="btn-text">
        <span class="btn-title">単語帳 — 未習得のみ</span>
        <span class="btn-desc">覚えた済み以外の単語を表示</span>
      </div>
    </button>

    <button class="mode-btn" style="border-color:#b0c8e8;background:#eaf2ff;" onclick="startFlashSmart()">
      <div class="btn-icon" style="background:#d8eaff;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a6ab0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <div class="btn-text">
        <span class="btn-title">単語帳 — スマート400</span>
        <span class="btn-desc">未習得全部＋覚えた済みからランダムで合計400語</span>
      </div>
    </button>

    <button class="mode-btn" style="border-color:#c8d8ee;background:#f0f6ff;" onclick="showSearch()">
      <div class="btn-icon" style="background:#e0ecff;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a7ab8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="btn-text">
        <span class="btn-title">単語を検索</span>
        <span class="btn-desc">英語・日本語で単語を調べる</span>
      </div>
    </button>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="quizScreen">
  <div class="quiz-topbar">
    <button class="back-btn" onclick="goHome()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="prog-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
    <div class="score-chip" id="scoreChip">0 / 0</div>
  </div>

  <div class="word-card">
    <div class="word-tag" id="qTag">Q 1 / 20</div>
    <div class="word-english" id="qWord">match</div>
    <div class="word-phonetic" id="qPhonetic">/mætʃ/</div>
    <button class="speak-btn" onclick="speakCurrent()">
      <svg class="speak-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      発音を聞く
    </button>
  </div>

  <div class="choices" id="choices"></div>

  <div class="feedback-card" id="feedCard">
    <div class="feedback-label" id="feedLabel"></div>
    <div class="mnemonic-tag">語呂合わせ</div>
    <div class="mnemonic-body" id="feedMnemonic"></div>
  </div>

  <button class="next-btn" id="nextBtn" onclick="nextQ()">次の問題へ →</button>
</div>

<!-- FLASHCARD -->
<div class="screen" id="flashScreen">
  <div class="flash-topbar">
    <button class="back-btn" onclick="goHome()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="flash-counter" id="flashCounter">1 / 42</div>
    <button class="back-btn" onclick="shuffleFlash()" title="シャッフル">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
  </div>

  <div class="flashcard" id="flashcard" onclick="flipCard()">
    <div class="learned-badge" id="flashLearnedBadge">覚えた</div>
    <div class="flash-pos-badge" id="flashPosBadge"></div>
    <div class="flash-pos-badge" id="flashPosBadge"></div>
    <div class="flash-tap-hint" id="flashHint">タップで意味を表示</div>
    <div class="flash-word" id="flashWord">match</div>
    <div class="flash-phonetic" id="flashPhonetic">/mætʃ/</div>
    <div class="flash-meaning" id="flashMeaning" style="display:none"></div>
  </div>

  <button class="learned-btn" id="learnedBtn" onclick="toggleLearned()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    覚えた！
  </button>

  <div class="mnemonic-strip">
    <div class="mnemonic-tag-white">語呂合わせ</div>
    <div class="mnemonic-text-white" id="flashMnemonic"></div>
  </div>

  <div class="flash-nav">
    <button class="nav-btn" onclick="flashPrev()">← 前</button>
    <button class="nav-btn center" onclick="speakFlash()">発音</button>
    <button class="nav-btn" onclick="flashNext()">次 →</button>
  </div>
</div>

<!-- SEARCH -->
<div class="screen" id="searchScreen">
  <div class="search-topbar">
    <button class="back-btn" onclick="goHome()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div style="font-size:0.95rem;font-weight:800;color:var(--text);">単語検索</div>
  </div>
  <div class="search-input-wrap">
    <input class="search-input" id="searchInput" type="text" placeholder="英語または日本語で検索..." oninput="doSearch(this.value)" autocomplete="off">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>
  <div id="searchResults">
    <div class="search-hint">英語（例：match）または日本語（例：一致）で検索</div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="resultScreen">
  <div class="result-wrap">
    <div class="result-card">
      <div class="result-title">テスト結果</div>
      <div class="result-score" id="rScore">0</div>
      <div class="result-denom" id="rDenom">/ 20問正解</div>
      <div class="result-pct" id="rPct">—</div>
      <div class="result-msg" id="rMsg"></div>
      <div class="result-actions">
        <button class="btn-retry" onclick="startQuiz(false)">もう一度チャレンジ</button>
        <button class="btn-home" onclick="goHome()">ホームに戻る</button>
      </div>
    </div>
  </div>
</div>

</div><!-- .app -->
<div class="confetti-wrap" id="confettiWrap"></div>

// ===== USER AUTH (localStorage) =====
function getUsers() { return JSON.parse(localStorage.getItem('gf_users') || '[]'); }
function saveUsers(u) { localStorage.setItem('gf_users', JSON.stringify(u)); }
function getCurrentUser() { return localStorage.getItem('gf_current_user') || null; }
function setCurrentUser(u) { localStorage.setItem('gf_current_user', u); }

// per-user keys
function keyLearned(u) { return 'gf_learned_' + u; }
function keyTries(u)   { return 'gf_tries_' + u; }
function keyBest(u)    { return 'gf_best_' + u; }

function getBestScores(u) {
  return JSON.parse(localStorage.getItem(keyBest(u)) || '{}');
}
function saveBestScore(u, count, pct) {
  const scores = getBestScores(u);
  const key = count >= 9999 ? 'all' : String(count);
  if (!scores[key] || pct > scores[key]) {
    scores[key] = pct;
    localStorage.setItem(keyBest(u), JSON.stringify(scores));
  }
}
function getBestForCount(u, count) {
  const scores = getBestScores(u);
  const key = count >= 9999 ? 'all' : String(count);
  return scores[key] || null;
}

function loadLearned() {
  const u = getCurrentUser();
  return new Set(JSON.parse(localStorage.getItem(keyLearned(u)) || '[]'));
}
function saveLearned(set) {
  const u = getCurrentUser();
  localStorage.setItem(keyLearned(u), JSON.stringify([...set]));
}

// ===== STATE =====
let quizList = [], curQ = 0, score = 0, numQ = 20, answered = false;
let flashList = [], flashIdx = 0, flashFlipped = false;
let learned = new Set();

// ===== AUTH UI =====
function showLogin() {
  document.getElementById('loginError').style.display = 'none';
  show('loginScreen');
}
function showRegister() {
  document.getElementById('regError').style.display = 'none';
  show('registerScreen');
}

let pendingAvatar = null;
function previewAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingAvatar = e.target.result;
    const el = document.getElementById('regAvatarPreview');
    el.innerHTML = '<img src="' + pendingAvatar + '">';
  };
  reader.readAsDataURL(file);
}

function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  if (!username || !password) { showErr(errEl, 'ユーザー名とパスワードを入力してください'); return; }
  const users = getUsers();
  const user = users.find(u => u.username === username && u.password === password);
  if (!user) { showErr(errEl, 'ユーザー名またはパスワードが違います'); return; }
  setCurrentUser(username);
  enterApp();
}

function doRegister() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  const errEl = document.getElementById('regError');
  if (!username || !password) { showErr(errEl, 'ユーザー名とパスワードを入力してください'); return; }
  if (password !== password2) { showErr(errEl, 'パスワードが一致しません'); return; }
  if (password.length < 4) { showErr(errEl, 'パスワードは4文字以上にしてください'); return; }
  const users = getUsers();
  if (users.find(u => u.username === username)) { showErr(errEl, 'そのユーザー名はすでに使われています'); return; }
  users.push({ username, password, avatar: pendingAvatar || null });
  saveUsers(users);
  setCurrentUser(username);
  enterApp();
}

function doLogout() {
  const _lu = getCurrentUser();
  if (_lu) {
    localStorage.removeItem('gf_screen_' + _lu);
    localStorage.removeItem('gf_quiz_state_' + _lu);
    localStorage.removeItem('gf_flash_state_' + _lu);
  }
  localStorage.removeItem('gf_current_user');
  learned = new Set();
  pendingAvatar = null;
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  show('loginScreen');
}

function showErr(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}

function enterApp() {
  learned = loadLearned();
  const username = getCurrentUser();
  const users = getUsers();
  const user = users.find(u => u.username === username);
  // set user bar
  document.getElementById('homeUserName').textContent = username;
  const avatarEl = document.getElementById('homeAvatar');
  if (user && user.avatar) {
    avatarEl.innerHTML = '<img src="' + user.avatar + '">';
  } else {
    avatarEl.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#a09aac"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>';
  }
  show('homeScreen');
  init();
}

// ===== INIT =====
function init() {
  const u = getCurrentUser();
  const best = getBestForCount(u, numQ);
  document.getElementById('statWords').textContent = VOCAB.length;
  document.getElementById('statLearned').textContent = learned.size;
  document.getElementById('statBest').textContent = best ? best + '%' : '—';
}

function setCount(n, el) {
  numQ = n;
  document.querySelectorAll('.count-opt').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  init(); // update best score for this count
}

// ===== SCREENS =====
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id !== 'loginScreen' && id !== 'registerScreen') {
    const u = getCurrentUser();
    if (u) localStorage.setItem('gf_screen_' + u, id);
  }
}
function goHome() { show('homeScreen'); init(); }

// ===== QUIZ =====
function shuffle(arr) { return [...arr].sort(()=>Math.random()-0.5); }

function startQuiz(unlearnedOnly) {
  let pool = unlearnedOnly ? VOCAB.filter(v => !learned.has(v.word)) : VOCAB;
  if (pool.length === 0) { alert('未習得の単語がありません！'); return; }
  if (pool.length < 4) { alert('未習得の単語が少なすぎます（最低4語必要）。'); return; }
  quizList = shuffle(pool).slice(0, Math.min(numQ, pool.length));
  curQ = 0; score = 0; answered = false;
  show('quizScreen');
  renderQ();
}

function renderQ() {
  const q = quizList[curQ];
  answered = false;
  document.getElementById('qTag').textContent = 'Q ' + (curQ+1) + ' / ' + quizList.length;
  document.getElementById('qWord').textContent = q.word;
  document.getElementById('qPhonetic').textContent = q.phonetic;
  document.getElementById('progBar').style.width = (curQ / quizList.length * 100) + '%';
  document.getElementById('scoreChip').textContent = score + ' / ' + curQ;
  document.getElementById('feedCard').classList.remove('visible');
  document.getElementById('nextBtn').style.display = 'none';
  const wrong = shuffle(VOCAB.filter(v=>v.word!==q.word)).slice(0,3);
  const opts = shuffle([q, ...wrong]);
  const el = document.getElementById('choices');
  el.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = o.jp;
    b.onclick = () => pick(b, o.word === q.word, q);
    el.appendChild(b);
  });
  // 状態保存
  const _u = getCurrentUser();
  if (_u) localStorage.setItem('gf_quiz_state_' + _u, JSON.stringify({ words: quizList.map(v=>v.word), curQ, score, numQ }));
}

function pick(btn, correct, q) {
  if (answered) return;
  answered = true;
  if (correct) {
    btn.classList.add('correct');
    score++;
    document.getElementById('feedLabel').className = 'feedback-label ok';
    document.getElementById('feedLabel').textContent = '正解！';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn').forEach(b => { if (b.textContent === q.jp) b.classList.add('correct'); });
    document.getElementById('feedLabel').className = 'feedback-label ng';
    document.getElementById('feedLabel').textContent = '不正解... 正解：' + q.jp;
  }
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  document.getElementById('feedMnemonic').textContent = q.mnemonic;
  document.getElementById('feedCard').classList.add('visible');
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('scoreChip').textContent = score + ' / ' + (curQ+1);
}

function nextQ() {
  curQ++;
  if (curQ >= quizList.length) showResult();
  else renderQ();
}
function speakCurrent() { speak(document.getElementById('qWord').textContent); }

// ===== RESULT =====
function showResult() {
  const u = getCurrentUser();
  const pct = Math.round(score / quizList.length * 100);
  saveBestScore(u, numQ, pct);
  const tries = parseInt(localStorage.getItem(keyTries(u)) || '0') + 1;
  localStorage.setItem(keyTries(u), tries);

  document.getElementById('rScore').textContent = score;
  document.getElementById('rDenom').textContent = '/ ' + quizList.length + '問正解';
  let grade, msg, cls;
  if (pct >= 90) { grade='S'; msg='完璧！さすがすぎる！'; cls='s'; launchConfetti(); }
  else if (pct >= 70) { grade='A'; msg='かなりいい感じ！もう少し！'; cls='a'; }
  else if (pct >= 50) { grade='B'; msg='半分クリア！語呂合わせで復習しよう'; cls='b'; }
  else              { grade='C'; msg='単語帳で見直してから再挑戦！'; cls='c'; }
  const pctEl = document.getElementById('rPct');
  pctEl.textContent = grade + ' ランク — ' + pct + '%';
  pctEl.className = 'result-pct ' + cls;
  document.getElementById('rMsg').textContent = msg;
  show('resultScreen');
}

// ===== FLASHCARD =====
function startFlash(unlearnedOnly) {
  let pool = unlearnedOnly ? VOCAB.filter(v => !learned.has(v.word)) : VOCAB;
  if (pool.length === 0) { alert('未習得の単語がありません！'); return; }
  flashList = [...pool];
  flashIdx = 0;
  show('flashScreen');
  renderFlash();
}
function startFlashSmart() {
  const SMART_MAX = 400;
  const unlearned = VOCAB.filter(v => !learned.has(v.word));
  const learnedArr = VOCAB.filter(v => learned.has(v.word));
  let pool;
  if (unlearned.length >= SMART_MAX) {
    pool = shuffle(unlearned).slice(0, SMART_MAX);
  } else {
    const remaining = SMART_MAX - unlearned.length;
    const extra = shuffle(learnedArr).slice(0, remaining);
    pool = shuffle([...unlearned, ...extra]);
  }
  if (pool.length === 0) { alert('単語がありません！'); return; }
  flashList = pool;
  flashIdx = 0;
  show('flashScreen');
  renderFlash();
}
function shuffleFlash() { flashList = shuffle(flashList); flashIdx = 0; renderFlash(); }

function renderFlash() {
  const v = flashList[flashIdx];
  flashFlipped = false;
  // 状態保存
  const _fu = getCurrentUser();
  if (_fu) localStorage.setItem('gf_flash_state_' + _fu, JSON.stringify({ words: flashList.map(v=>v.word), flashIdx }));
  document.getElementById('flashPosBadge').className = 'flash-pos-badge';
  document.getElementById('flashCounter').textContent = (flashIdx+1) + ' / ' + flashList.length;
  document.getElementById('flashWord').textContent = v.word;
  document.getElementById('flashPhonetic').textContent = v.phonetic;
  document.getElementById('flashMeaning').textContent = v.jp;
  document.getElementById('flashMeaning').style.display = 'none';
  document.getElementById('flashPhonetic').style.display = '';
  document.getElementById('flashHint').textContent = 'タップで意味を表示';
  document.getElementById('flashMnemonic').textContent = v.mnemonic;
  const isLearned = learned.has(v.word);
  const btn = document.getElementById('learnedBtn');
  const badge = document.getElementById('flashLearnedBadge');
  btn.className = 'learned-btn' + (isLearned ? ' checked' : '');
  btn.innerHTML = isLearned
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> 覚えた！（取り消す）'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2z"/></svg> 覚えた！';
  badge.className = 'learned-badge' + (isLearned ? ' show' : '');
}

function toggleLearned() {
  const v = flashList[flashIdx];
  if (learned.has(v.word)) learned.delete(v.word);
  else learned.add(v.word);
  saveLearned(learned);
  renderFlash();
  document.getElementById('statLearned').textContent = learned.size;
}

function flipCard() {
  if (!flashFlipped) {
    flashFlipped = true;
    document.getElementById('flashMeaning').style.display = 'block';
    document.getElementById('flashPhonetic').style.display = 'none';
    document.getElementById('flashHint').textContent = 'タップで単語に戻す';
    const _v = flashList[flashIdx];
    if (_v.pos) {
      const _pb = document.getElementById('flashPosBadge');
      _pb.textContent = _v.pos;
      _pb.classList.add('show');
    }
  } else { renderFlash(); }
}
function flashPrev() { flashIdx = (flashIdx - 1 + flashList.length) % flashList.length; renderFlash(); }
function flashNext() { flashIdx = (flashIdx + 1) % flashList.length; renderFlash(); }
function speakFlash() { speak(flashList[flashIdx].word); }

// ===== SPEECH =====
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word) {
  if (!('speechSynthesis' in window)) { alert('このブラウザは発音機能に対応していません'); return; }
  window.speechSynthesis.cancel();
  function doSpeak() {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const en = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en'));
    if (en) u.voice = en;
    window.speechSynthesis.speak(u);
  }
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) doSpeak();
  else {
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged = null; doSpeak(); };
    setTimeout(doSpeak, 300);
  }
}

// ===== CONFETTI =====
function launchConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#c0718a','#8a7ab8','#6aa88c','#b88a50','#d4a0b4','#a090cc'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.width = (6 + Math.random()*8) + 'px';
    p.style.height = (6 + Math.random()*8) + 'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    p.style.animationDuration = (1.5 + Math.random()*2) + 's';
    p.style.animationDelay = Math.random()*1.2 + 's';
    wrap.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ===== SEARCH =====
function showSearch() {
  show('searchScreen');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  document.getElementById('searchResults').innerHTML = '<div class="search-hint">英語（例：match）または日本語（例：一致）で検索</div>';
  setTimeout(() => document.getElementById('searchInput').focus(), 100);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  document.getElementById('searchResults').innerHTML = '<div class="search-hint">英語（例：match）または日本語（例：一致）で検索</div>';
  document.getElementById('searchInput').focus();
}

function doSearch(q) {
  document.getElementById('searchClear').style.display = q ? 'block' : 'none';
  const wrap = document.getElementById('searchResults');
  if (!q.trim()) {
    wrap.innerHTML = '<div class="search-hint">英語（例：match）または日本語（例：一致）で検索</div>';
    return;
  }
  const kw = q.trim().toLowerCase();
  const hits = VOCAB.filter(v =>
    v.word.toLowerCase().includes(kw) ||
    v.jp.includes(q.trim()) ||
    v.mnemonic.includes(q.trim())
  );
  if (hits.length === 0) {
    wrap.innerHTML = '<div class="no-results">「' + q + '」に一致する単語が見つかりませんでした</div>';
    return;
  }
  wrap.innerHTML = '<div class="search-count">' + hits.length + '件ヒット</div>' +
    hits.map(v => {
      const badge = learned.has(v.word) ? '<span style="font-size:0.6rem;background:var(--sage-light);color:var(--sage);padding:2px 8px;border-radius:99px;font-weight:800;border:1px solid #b8dac8;">覚えた</span>' : '';
      return '<div class="search-result-card" onclick="openFromSearch(\'' + v.word + '\')">' +
        '<div class="sr-top"><span class="sr-word">' + v.word + '</span><span class="sr-phonetic">' + v.phonetic + '</span>' + badge + '</div>' +
        '<div class="sr-jp">' + v.jp + '</div>' +
        '<div class="sr-mnemonic">' + v.mnemonic + '</div>' +
        '<div class="sr-open-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>単語帳で開く</div>' +
        '</div>';
    }).join('');
}

function openFromSearch(word) {
  const idx = VOCAB.findIndex(v => v.word === word);
  if (idx === -1) return;
  flashList = [...VOCAB];
  flashIdx = idx;
  show('flashScreen');
  renderFlash();
}

// ===== BOOT =====
(function() {
  const u = getCurrentUser();
  if (u) {
    learned = loadLearned();
    enterApp();
    // 前回のスクリーン状態を復元
    const lastScreen = localStorage.getItem('gf_screen_' + u);
    if (lastScreen === 'quizScreen') {
      const qs = JSON.parse(localStorage.getItem('gf_quiz_state_' + u) || 'null');
      if (qs && qs.words && qs.words.length > 0) {
        const wordMap = {};
        VOCAB.forEach(v => { wordMap[v.word.trim()] = v; });
        quizList = qs.words.map(w => wordMap[w.trim()]).filter(Boolean);
        curQ = qs.curQ || 0;
        score = qs.score || 0;
        numQ = qs.numQ || 20;
        answered = false;
        if (quizList.length > 0 && curQ < quizList.length) {
          show('quizScreen');
          renderQ();
        }
      }
    } else if (lastScreen === 'flashScreen') {
      const fs = JSON.parse(localStorage.getItem('gf_flash_state_' + u) || 'null');
      if (fs && fs.words && fs.words.length > 0) {
        const wordMap = {};
        VOCAB.forEach(v => { wordMap[v.word.trim()] = v; });
        flashList = fs.words.map(w => wordMap[w.trim()]).filter(Boolean);
        flashIdx = fs.flashIdx || 0;
        if (flashList.length > 0) {
          show('flashScreen');
          renderFlash();
        }
      }
    }
  } else {
    show('loginScreen');
  }
})();
</script>
